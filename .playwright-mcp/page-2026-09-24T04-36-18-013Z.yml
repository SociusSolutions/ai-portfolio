        - generic [ref=f1e47]:
          - heading "Problem" [level=2] [ref=f1e48]
          - paragraph [ref=f1e49]:
            - text: Running a brick-and-mortar business generates a specific kind of exhaustion that has nothing to do with the work itself. The membership system knows who pays. The CRM knows who enquired. The accounting software knows what was spent. The booking system knows who showed up. None of them talk, so every real question —
            - emphasis [ref=f1e50]: are we growing, did that ad work, how many of those trials converted, what did we actually spend on gear
            - text: — becomes an hour of tab-switching and mental arithmetic.
          - paragraph [ref=f1e51]: Worse, the answer expires. Whatever you worked out on Tuesday is wrong by Friday, so the work repeats. The cost is not the hour; it is that you stop asking, and then you are operating blind.
          - paragraph [ref=f1e52]: I wanted one place that knew everything, refreshed itself, and could be asked a question in plain language.
          - heading "What I built" [level=2] [ref=f1e53]
          - paragraph [ref=f1e54]: Socius OS is a single repository that functions as the operating brain for the business. It is not an application with a UI — it is a structured knowledge base, an integration layer, a set of executable procedures, and a generated dashboard, all under version control and all readable by a language-model agent.
          - paragraph [ref=f1e55]:
            - text: The organising principle is
            - strong [ref=f1e56]: hub and satellite
            - text: . The OS holds the maps, the procedures, the integration contracts and the decision record. The customer-facing applications — the website, the members platform, the tournament tooling, the signage — stay in their own repositories with their own deploys, and the OS reaches them through pointer files and domain maps. It references; it never absorbs. That constraint is what keeps a system this broad from collapsing into a monolith nobody can change safely.
          - generic [ref=f1e57]: Figure 1 — Hub and satellite architecture
          - paragraph [ref=f1e63]: Four pieces do the real work.
          - paragraph [ref=f1e64]:
            - strong [ref=f1e65]: Domain maps.
            - text: Eight documents, one per operational area, each describing what the area is, where its data lives, what is automated and what is still manual. A domain map is deliberately
            - emphasis [ref=f1e66]: not
            - text: the code. It is the thing an agent reads to orient itself before touching anything, which is why a new capability can be added without re-explaining the business every time.
          - paragraph [ref=f1e67]:
            - strong [ref=f1e68]: Integration contracts.
            - text: "Every wired system has a contract document, and each one opens with the same two sections: what is UI-only, and what fails silently. That ordering is not stylistic. The expensive failures in integration work are never the documented endpoints — they are the write that returns"
            - code [ref=f1e69]: "200"
            - text: and does nothing, and the field the API will happily read but never let you set. Writing those down first turned a recurring multi-hour tax into a five-minute read.
          - paragraph [ref=f1e70]:
            - strong [ref=f1e71]: Skills as procedure.
            - text: "Fourteen agent skills encode the recurring operational work: a morning check that reports what is overdue and what moved, a funnel refresh, an inbox triage that drafts replies, a spam sweep, a stale-lead scan, a monthly financial close, an inventory ledger, a curriculum planner. Each is a version-controlled document that an agent executes, which means the procedure is reviewable, diffable and improvable — the opposite of instructions living in someone’s head."
          - paragraph [ref=f1e72]:
            - strong [ref=f1e73]: A read-only HUD.
            - text: "The JARVIS dashboard is a static page with no build step and no server. It never queries anything live. Instead the agent is the write head: a refresh re-probes every integration, pulls current figures, runs the record loaders and regenerates a single data file. The dashboard just renders it. Splitting write from read this way means the dashboard cannot be slow, cannot be down, and cannot lie about freshness — it carries the timestamp of the refresh that produced it."
          - heading "How it works" [level=2] [ref=f1e74]
          - paragraph [ref=f1e75]: The daily cycle is scheduled, not manual.
          - generic [ref=f1e76]:
            - generic [ref=f1e77]: Figure 2 — The daily refresh cycle
            - generic [ref=f1e78]: "sequenceDiagram autonumber participant S as Scheduler participant A as Agent participant X as External systems participant R as Records store participant D as Dashboard S->>A: morning chain A->>X: probe every integration X-->>A: health + current figures A->>A: funnel, spam sweep, inbox triage,stale leads, ad performance A->>R: load and roll up records R-->>A: derived series A->>D: regenerate data file A->>A: write dashboards to disk Note over A,D: dashboard renders a snapshot,stamped with refresh time"
          - paragraph [ref=f1e80]: Two design decisions carry most of the weight.
          - paragraph [ref=f1e81]:
            - strong [ref=f1e82]: Append-only decision log.
            - text: Every non-obvious decision gets a dated entry with its reasoning. The value is not documentation discipline for its own sake — it is that an agent picking up work months later can read
            - emphasis [ref=f1e83]: why
            - text: something is the way it is, and stops proposing the thing that was already tried and rejected.
          - paragraph [ref=f1e84]:
            - strong [ref=f1e85]: Playbooks that encode losses.
            - text: After one paid campaign spent $751 and produced three attended trials and zero members, the outcome became ten non-negotiable rules with a pre-flight checklist that must be run before any spend goes live. Encoding a failure as an executable gate is considerably more useful than remembering it.
          - heading "AI techniques used" [level=2] [ref=f1e86]
          - list [ref=f1e87]:
            - listitem [ref=f1e88]:
              - strong [ref=f1e89]: Skills as version-controlled procedure.
              - text: Operational work is written as documents an agent executes, not as code paths. Procedures get reviewed in pull requests like anything else.
            - listitem [ref=f1e90]:
              - strong [ref=f1e91]: A read-only analyst subagent
              - text: for questions that need figures cross-checked across the membership, CRM and accounting systems. It returns the reconciled conclusion rather than the raw pulls, and cannot write anything.
            - listitem [ref=f1e92]:
              - strong [ref=f1e93]: MCP as the integration boundary.
              - text: Each external system is reached through a Model Context Protocol server — some vendor-published and self-hosted, one written from scratch for the signage system — so the agent gets typed tools instead of ad-hoc HTTP, and access is auditable per system.
            - listitem [ref=f1e94]:
              - strong [ref=f1e95]: Contract-first tool use.
              - text: The agent reads the API contract document before its first call against any system. The contracts lead with the silent-failure cases because that is where the hours go.
            - listitem [ref=f1e96]:
              - strong [ref=f1e97]: Generated artefacts, never hand-edited.
              - text: Dashboards and data files are outputs. The generator is the source of truth, and drift between them is a bug with an owner.
          - heading "Outcome" [level=2] [ref=f1e98]
          - list [ref=f1e99]:
            - listitem [ref=f1e100]:
              - text: The weekly question
              - emphasis [ref=f1e101]: where does the business stand
              - text: went from an hour of tab-switching to opening one page.
            - listitem [ref=f1e102]: Membership, CRM, accounting, ad spend and attendance are reconciled in one place, on a schedule, without anyone remembering to do it.
            - listitem [ref=f1e103]: Lead handling moved fully in-house after an outsourced provider was dropped, with the trial flow — enquiry, booked, showed, closed — instrumented end to end.
            - listitem [ref=f1e104]: Financial close, inventory counts and tax classification run as documented procedures rather than annual archaeology.
            - listitem [ref=f1e105]: Recurring operational work is now reviewable. When a procedure is wrong, the fix is a diff, and it stays fixed.
          - heading "What I’d do differently" [level=2] [ref=f1e106]
          - paragraph [ref=f1e107]:
            - text: I split lead automation into a second repository early on, and the two converged on the same problems independently — an opt-out audit and a spam classifier each got built twice before anyone noticed. The boundary was drawn around
            - emphasis [ref=f1e108]: how
            - text: the work ran rather than
            - emphasis [ref=f1e109]: what
            - text: it was about. I would draw it around the domain instead, and require a search of the other repository before any new check ships. It is now written into the contributing rules, which is the cheap version of the lesson.
          - paragraph [ref=f1e110]: I would also add the eval harness earlier. The classification skills — expense categories, spam, lead stage — were trusted on inspection for longer than they should have been. Retrieval and extraction quality is measurable, and measuring it changes what you are willing to automate.
