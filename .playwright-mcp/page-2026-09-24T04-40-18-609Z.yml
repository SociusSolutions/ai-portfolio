                  - paragraph [ref=f7e149]: Static deploy
                  - paragraph [ref=f7e156]: Screen — player
                  - paragraph [ref=f7e163]: Screen — player
          - paragraph [ref=f7e164]: No build step. No server. No framework. No database. The state of the physical screens in a physical room is a versioned file, which means it has a history, a diff, an author per change, and a one-command rollback. Signage systems costing hundreds of dollars a year do not give you that.
          - paragraph [ref=f7e165]:
            - text: It is also deliberately its
            - strong [ref=f7e166]: own repository and its own deployment
            - text: ", separate from the business dashboard that links to it. Nothing imports across the boundary. Working on signage cannot break the dashboard and working on the dashboard cannot take down the screens on the wall. When two systems have genuinely different failure consequences, coupling them to share a little code is a bad trade."
          - heading "How it works" [level=2] [ref=f7e167]
          - paragraph [ref=f7e168]:
            - text: The more interesting half is that the signage is
            - strong [ref=f7e169]: agent-operable
            - text: ", because I wrote an MCP server for it."
          - paragraph [ref=f7e170]: Model Context Protocol is how a language model is given typed tools instead of being told to go and edit files. The server exposes the operations signage actually needs — set the ticker, set a countdown, post or remove an announcement, set the weekly schedule, replace schedule rows, add an image slide, prune expired items, inspect the current state, validate, and publish.
          - paragraph [ref=f7e171]:
            - text: The design decision that matters is that
            - strong [ref=f7e172]:
              - text: every content tool writes to a draft, and only
              - code [ref=f7e173]: publish
              - text: pushes the draft to the screens.
            - text: There is a separate
            - code [ref=f7e174]: validate
            - text: that checks the draft first.
          - generic [ref=f7e175]: Figure 2 — Why the draft boundary exists
          - paragraph [ref=f7e181]: This is the part I would point to as tool design rather than plumbing. An agent editing a public display is a small but real trust problem — the output is visible to every member and visitor in the building, and a partial edit is worse than no edit. A tool surface where every write is reversible and invisible until one explicit irreversible call makes the whole capability safe to expose. The agent can work freely; the wall only changes on purpose.
          - paragraph [ref=f7e182]: The practical result is that changing the screens is a sentence. “No kids class Monday, put up the tournament countdown” updates the schedule, posts the announcement, sets the countdown, and reports what will change before anything changes. Expired announcements are pruned rather than accumulating, which is the failure mode of every noticeboard ever built.
          - heading "AI techniques used" [level=2] [ref=f7e183]
          - list [ref=f7e184]:
            - listitem [ref=f7e185]:
              - strong [ref=f7e186]: An MCP server, authored for this system.
              - text: Not a generic file-editing agent pointed at a repository — a purpose-built tool surface expressing the operations the domain actually has.
            - listitem [ref=f7e187]:
              - strong [ref=f7e188]: Draft-validate-publish tool semantics.
              - text: Every write is to a draft; a validator checks it; one explicit call commits. The safety property is in the shape of the tool surface, not in instructions asking the model to be careful.
            - listitem [ref=f7e189]:
              - strong [ref=f7e190]: Validation as a first-class tool
              - text: the agent can call on itself before showing a human anything.
            - listitem [ref=f7e191]:
              - strong [ref=f7e192]: Narrow, domain-shaped tools.
              - text: “Set the countdown” and “prune expired” rather than “write this JSON”. Narrow tools are harder to misuse and their failures are legible.
            - listitem [ref=f7e193]:
              - strong [ref=f7e194]: Reversibility by design.
              - text: Published state is a committed file, so every change has an author, a diff and a rollback.
          - heading "Outcome" [level=2] [ref=f7e195]
          - list [ref=f7e196]:
            - listitem [ref=f7e197]: Two screens running on a static deployment with no subscription and no player software to maintain.
            - listitem [ref=f7e198]: The state of the screens is version-controlled, with history and one-command rollback.
            - listitem [ref=f7e199]: Updating the wall is a spoken sentence rather than a login, and the person doing it does not need to know how any of it works.
            - listitem [ref=f7e200]: No build step and no dependencies means nothing to keep alive. It will still work in two years.
            - listitem [ref=f7e201]: Isolated from the business dashboard, so neither can take the other down.
          - heading "What I’d do differently" [level=2] [ref=f7e202]
          - paragraph [ref=f7e203]: "The player trusts that the published file is well-formed, because validation happens before publishing rather than at render. That is the right place for it in the normal path, but it means a malformed file reaching the screens has no graceful degradation — the display just breaks, in public, in front of everyone. I would add a last-known-good fallback in the player: if the current snapshot fails to parse, keep rendering the previous one and surface the problem quietly rather than showing a blank television."
          - paragraph [ref=f7e204]: I would also give the editor and the MCP server a shared schema definition. Right now both understand the snapshot format and they agree because I wrote them together. That agreement is a convention, not an enforced contract, and the first divergence will be found on the wall.
