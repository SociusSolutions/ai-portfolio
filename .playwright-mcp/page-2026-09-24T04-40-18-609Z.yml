        - generic [ref=f7e48]:
          - heading "Problem" [level=2] [ref=f7e49]
          - paragraph [ref=f7e50]: The gym has televisions on the wall. They should show the class schedule, what is coming up, a countdown to the next event, and whatever needs announcing this week.
          - paragraph [ref=f7e51]: Commercial digital signage sells this as a subscription per screen, with a hosted editor, an account, and a player application to install and keep updated. For two screens in a gym that is a recurring cost and an ongoing dependency in exchange for a great deal of functionality nobody here needs.
          - paragraph [ref=f7e52]: "The actual requirement is small and specific: someone should be able to change what is on the screens in under a minute, from a phone, without logging into anything; the screens should pick the change up on their own; and the whole thing should still work in two years without anyone maintaining it. The last point rules out most of the obvious approaches — a signage system that needs a dependency upgrade to keep displaying a schedule has failed at its one job."
          - heading "What I built" [level=2] [ref=f7e53]
          - paragraph [ref=f7e54]: Two pages and a file.
          - paragraph [ref=f7e55]:
            - text: An
            - strong [ref=f7e56]: editor
            - text: builds a display. A
            - strong [ref=f7e57]: player
            - text: renders one full-screen and is what the television points at. And a single
            - strong [ref=f7e58]: published snapshot file, committed to the repository, is the only source of truth for what is on the screens.
            - text: Committing a change to that file redeploys the site, and every screen picks it up on its next poll.
          - generic [ref=f7e59]:
            - generic [ref=f7e60]: Figure 1 — The published file is the state
            - document [ref=f7e63]:
              - generic [ref=f7e65]:
