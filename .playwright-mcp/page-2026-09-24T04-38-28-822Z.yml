        - generic [ref=f3e48]:
          - heading "Problem" [level=2] [ref=f3e49]
          - paragraph [ref=f3e50]: Planning children’s classes was the single largest time sink in the business — the owner’s own assessment, and the reason this exists.
          - paragraph [ref=f3e51]: "The teaching method is constraints-led: instead of drilling a technique by repetition, you design a game with rules and constraints that force the skill to emerge. It works considerably better than demonstration-and-drill, and it is far harder to plan. Every session needs games that target a specific skill, scale to two different age bands, work with whatever number of kids turn up, and stay genuinely fun — because a bored eight-year-old simply stops."
          - paragraph [ref=f3e52]: Then the same plan has to be communicated to three audiences who need completely different things from it. A coach needs setup, constraints, coaching cues and progressions. A kid needs to know how to win, in words a nine-year-old reads without help. A parent needs to know what their child worked on, in a way that prompts a conversation in the car rather than a shrug.
          - paragraph [ref=f3e53]: Written by hand that is several hours a week, every week, forever. And the quality drifts with how tired you were on Sunday night.
          - heading "What I built" [level=2] [ref=f3e54]
          - paragraph [ref=f3e55]: An engine that generates a week’s games as structured specifications, scores them against a rubric before any are kept, packages the survivors into a class plan, and renders that one plan into three audience-specific views — each of which must pass its own automated validation.
          - generic [ref=f3e56]:
            - generic [ref=f3e57]: Figure 1 — Generation, scoring, rendering
