          - paragraph [ref=f3e180]: Four decisions make this work rather than produce plausible-sounding filler.
          - paragraph [ref=f3e181]:
            - strong [ref=f3e182]: Games are schemas, not prose.
            - text: A generated game is a structured object with named fields — objective, constraints, win condition, space, progressions, the skill it targets. Because it is structured, it can be validated, stored, queried, compared and reused. Prose can only be read and re-read. Everything downstream depends on this choice.
          - paragraph [ref=f3e183]:
            - strong [ref=f3e184]: Every game is generated twice, as one game.
            - text: The same game is produced scaled for younger and older bands simultaneously, rather than generating separately and hoping they correspond. Coaches run mixed classes; the two versions have to be recognisably the same game or the session falls apart.
          - paragraph [ref=f3e185]:
            - strong [ref=f3e186]: Candidates are scored, not inspected.
            - text: A rubric evaluator runs over every generated candidate and only those above threshold are kept. This is the part that distinguishes a generator from a content firehose. Unscored generation produces volume, and volume of mediocre lesson plans is worse than none — it costs the coach the review time and then disappoints the class.
          - paragraph [ref=f3e187]:
            - strong [ref=f3e188]: Each audience view has a machine-checked standard.
            - text: The kid card must come in at a fifth-grade reading level or below. The parent view must be eighth-grade or below and must end with a question, because a question is what actually starts a conversation in the car. The coach view must be structurally complete — no missing setup, no missing progression. These are automated gates, not review guidance, and a draft that fails one does not ship.
          - generic [ref=f3e189]: Figure 2 — One plan, three audiences, three standards
          - paragraph [ref=f3e195]:
            - strong [ref=f3e196]: Plans are dateless.
            - text: Generation produces a plan; scheduling assigns the date and the coach later. Separating the two means a plan is reusable content rather than a calendar entry, and the library accumulates instead of expiring.
          - paragraph [ref=f3e197]: The platform side is a Next.js application on Supabase with row-level security and federated sign-in, running in production for members, with invite-based onboarding.
          - heading "How it works" [level=2] [ref=f3e198]
          - paragraph [ref=f3e199]: The generation cycle is a batch, not a request. A skill bucket and a week’s theme go in; candidates come out in both age bands; the rubric evaluator scores them; those above threshold are persisted to the library with their scores recorded. Packaging a batch into a class plan fills a plan template and renders the three views, each run through its validator before it is written to disk.
          - paragraph [ref=f3e200]:
            - text: The validators are where most of the reliability lives. A readability threshold is a crude measure of writing quality and an excellent measure of
            - emphasis [ref=f3e201]: audience fit
            - text: — it catches the specific, constant failure of a language model writing for children, which is drifting into adult sentence construction while keeping simple words. The rule is mechanical and it holds every time, which is more than can be said for remembering to check.
          - heading "AI techniques used" [level=2] [ref=f3e202]
          - list [ref=f3e203]:
            - listitem [ref=f3e204]:
              - strong [ref=f3e205]: Schema-constrained generation.
              - text: Output is a structured object against a defined schema, which is what makes it validatable, storable and reusable.
            - listitem [ref=f3e206]:
              - strong [ref=f3e207]: Rubric-based candidate evaluation
              - text: with an explicit pass threshold, so generation quality is enforced rather than assumed.
            - listitem [ref=f3e208]:
              - strong [ref=f3e209]: Paired multi-variant generation
              - text: — one game, two age bands, generated together so they stay coherent.
            - listitem [ref=f3e210]:
              - strong [ref=f3e211]: Multi-audience rendering from a single source
              - text: with a different standard per audience, rather than three independently written documents that drift apart.
            - listitem [ref=f3e212]:
              - strong [ref=f3e213]: Automated readability gates
              - text: as the mechanical check on audience fit, catching the failure mode that human review reliably misses when tired.
            - listitem [ref=f3e214]:
              - strong [ref=f3e215]: Agent skills as the interface.
              - text: Generation and packaging are invoked as version-controlled procedures with their validators attached, so the quality bar travels with the capability.
          - heading "Outcome" [level=2] [ref=f3e216]
          - list [ref=f3e217]:
            - listitem [ref=f3e218]: The largest recurring time cost in the business — several hours of class planning a week — became a batch run plus a review.
            - listitem [ref=f3e219]: Lesson quality stopped depending on how tired the planner was on a Sunday night, because the threshold is enforced by a rubric rather than by judgement at the end of a long day.
            - listitem [ref=f3e220]: Coaches, kids and parents each get material written for them, instead of one document that half-serves all three.
            - listitem [ref=f3e221]: The game library accumulates as structured, searchable, reusable content rather than a folder of documents.
            - listitem [ref=f3e222]: Parent communication went from nothing to a weekly note that reliably ends in a question — the cheapest engagement mechanism in the business.
          - heading "What I’d do differently" [level=2] [ref=f3e223]
          - paragraph [ref=f3e224]: The rubric was written before there was much generated output to calibrate it against, so the early thresholds were guesses. They needed adjustment once real candidates existed, and a batch scored under the old thresholds is not comparable to one scored under the new. I would version the rubric explicitly and record which version scored each game, so quality trends over time mean something.
          - paragraph [ref=f3e225]: I would also close the loop with what actually happened in class. Right now the system knows whether a game passed the rubric; it does not know whether the kids enjoyed it or the skill emerged. A one-tap coach rating after each session would make the library self-improving instead of merely growing, and that feedback signal is worth more than any further refinement of the generator.
