        - generic [ref=f2e47]:
          - heading "Problem" [level=2] [ref=f2e48]
          - paragraph [ref=f2e49]: The business runs its lead handling — enquiry, follow-up, booking, reminders, no-show recovery, re-engagement — on a commercial marketing platform. Roughly twenty-five workflows, each a branching sequence of emails, texts, waits and tag changes, all built by dragging boxes in a browser.
          - paragraph [ref=f2e50]:
            - text: "Then a reasonable question arrives:"
            - emphasis [ref=f2e51]: which of these is actually running, and what does it say?
          - paragraph [ref=f2e52]: "The platform’s public API cannot answer it. I verified this against the live account:"
          - code [ref=f2e56]: "GET /workflows/?locationId=... 200 id, name, status, version, updatedAt GET /workflows/{id} 404 GET /workflows/{id}/executions 404 GET /workflows/{id}/contacts 404 GET /workflows/{id}/enrollments 404"
          - paragraph [ref=f2e57]: You can list the workflows. You cannot read inside one, and you cannot see a single execution. The visual builder is the only way in, which makes every audit a manual click-through and every piece of institutional knowledge a screenshot.
          - paragraph [ref=f2e58]:
            - text: Two consequences fall out of that, and they shape the entire design.
            - strong [ref=f2e59]: Nothing can import your automation
            - text: — no tool can extract it, so any machine-readable description has to be authored. And
            - strong [ref=f2e60]: there is no engine telemetry
            - text: — an outbound message records that its source was “a workflow” but never which one, so monitoring cannot be read off the platform at all. It has to be reconstructed from outcomes.
          - heading "What I built" [level=2] [ref=f2e61]
          - paragraph [ref=f2e62]: "The Atlas is three things: a portable specification of every lead automation, a sync that reconstructs what is actually running, and an auditor that reads conversations the way a person would."
          - generic [ref=f2e63]:
            - generic [ref=f2e64]: Figure 1 — Specs in, console out
            - document [ref=f2e67]:
              - generic [ref=f2e79]:
                - paragraph [ref=f2e86]: gen_flows.pyauthor of record
                - paragraph [ref=f2e93]: flows/*.yaml~25 portable specs
                - paragraph [ref=f2e100]: bindings/gym.yamlthe only local file
                - paragraph [ref=f2e107]: build.py
                - paragraph [ref=f2e114]: taxonomy.yamlfour axes
                - paragraph [ref=f2e121]: facets.yamlhand-corrected
                - paragraph [ref=f2e128]: Marketing platformlist + messages only
                - paragraph [ref=f2e135]: sync.py
                - paragraph [ref=f2e142]: snapshot.jsonreconstructed telemetry
                - paragraph [ref=f2e149]: console.htmlreview + request changes
                - paragraph [ref=f2e156]: audit.pyconversation auditor
                - paragraph [ref=f2e163]: findingsshapes a human would wince at
          - paragraph [ref=f2e164]:
            - strong [ref=f2e165]: The specs are the source of truth, and a generator owns them.
            - text: Each workflow is a YAML document describing its trigger, its steps, its waits, its branches and its exact message copy. Critically, the spec files are
            - emphasis [ref=f2e166]: written by a generator
            - text: — hand edit one and the next run silently reverts you. The generator is the author of record, and a run against unchanged inputs must leave the spec directory byte-identical. That property is what makes the specs trustworthy rather than decorative.
          - paragraph [ref=f2e167]:
            - strong [ref=f2e168]: Everything is portable except one file.
            - text: "A spec says “submits the trial enquiry form” and “send the adult welcome message”. A single bindings file maps those names to this gym’s actual form identifiers, calendars and booking links. Standing the whole system up for a different gym is: copy the bindings file, swap the identifiers, leave every spec untouched. The automation design became an asset independent of the account it runs in."
          - paragraph [ref=f2e169]:
            - strong [ref=f2e170]: Monitoring is reconstructed by fingerprint.
            - text: Since the platform records only that a message came from “a workflow”, the sync attributes each send by matching its body against the copy in the specs. Retired wordings are kept in a
            - code [ref=f2e171]: previous_bodies
            - text: list so historical sends stay correctly attributed after copy changes — otherwise every edit would silently orphan its own history.
          - paragraph [ref=f2e172]:
            - strong [ref=f2e173]: A classification vocabulary, applied deliberately.
            - text: A taxonomy defines four gym-agnostic axes; a derivation script drafts each flow’s position on them from its spec; then those drafts are hand-corrected and committed. Machine-drafted, human-ratified — the draft saves the typing, the review is where the correctness comes from.
          - heading "How it works" [level=2] [ref=f2e174]
          - paragraph [ref=f2e175]: The most interesting component is the auditor, because it is the part that needed a language model rather than a rule.
          - paragraph [ref=f2e176]:
            - text: Ordinary monitoring can catch a hard failure. What it cannot catch is
            - emphasis [ref=f2e177]: embarrassment
            - text: ": an automated reminder firing into the middle of a live human conversation, a message naming a day for a class nobody ever replied about, a follow-up going out after someone asked to be left alone. These are not schema violations. They are judgement calls, and they are exactly what damages a small business’s reputation."
          - paragraph [ref=f2e178]: The auditor reads whole conversations in time order — every inbound and outbound message, automated and human together — and looks for those shapes.
          - generic [ref=f2e179]: Figure 2 — Audit pass over one conversation
          - paragraph [ref=f2e185]:
            - text: A second thing the tests enforce is subtler. The platform automatically appends its own opt-out line to the first text message a contact ever receives, whichever workflow happens to send it. So any message body that
            - emphasis [ref=f2e186]: also
            - text: carries an opt-out line reads as two the moment it lands first. A unit test asserts no spec body contains its own opt-out text — a formatting rule that only exists because of an undocumented platform behaviour, now permanently enforced.
          - paragraph [ref=f2e187]: "Because workflow interiors can only be changed through the browser, the change side is agent-driven browser automation. That produced its own catalogue of hard-won detail, all of it now written down: an occluded browser window delivers clicks to the parent page but silently drops them inside a cross-origin builder iframe, so every click vanishes while the page looks perfectly healthy; the singular builder URL loads and the plural one spins forever in a way that is indistinguishable from that same bug; saving a step leaves the workflow dirty and needs a separate top-level save; and merge fields are interactive chips, so select-all-and-retype destroys them silently."
          - heading "AI techniques used" [level=2] [ref=f2e188]
          - list [ref=f2e189]:
            - listitem [ref=f2e190]:
              - strong [ref=f2e191]: Specification as the primary artefact.
              - text: The language model’s job is to author and maintain precise specs, not to improvise against a live system. The spec is reviewable; the live change is mechanical.
            - listitem [ref=f2e192]:
              - strong [ref=f2e193]: LLM-judged conversation auditing
              - text: for failure modes that are qualitative rather than structural — tone, timing and talking over people.
            - listitem [ref=f2e194]:
              - strong [ref=f2e195]: Fingerprint attribution
              - text: to recover causality from a system that discards it, with versioned copy history so the reconstruction survives edits.
            - listitem [ref=f2e196]:
              - strong [ref=f2e197]: Machine-drafted, human-ratified classification.
              - text: Facets are derived automatically then corrected by hand and committed, so the vocabulary stays accurate without being typed from scratch.
            - listitem [ref=f2e198]:
              - strong [ref=f2e199]: Agent browser automation with a documented failure catalogue.
              - text: Every trap that cost a session is recorded as a pre-flight check rather than re-learned.
          - heading "Outcome" [level=2] [ref=f2e200]
          - list [ref=f2e201]:
            - listitem [ref=f2e202]: Every lead automation has a precise, diffable description for the first time. Reviewing what the business says to a prospect is reading a file, not clicking through a builder.
            - listitem [ref=f2e203]: The automation design is portable. Another gym is a bindings file, not a rebuild.
            - listitem [ref=f2e204]: Sends are attributed to specific workflows despite the platform never reporting which one, so monitoring exists where the vendor provides none.
            - listitem [ref=f2e205]: Compliance and tone problems surface as ranked findings with the transcript attached, instead of surfacing as a complaint.
            - listitem [ref=f2e206]: Platform behaviours that cost hours are now unit tests and pre-flight checks.
          - heading "What I’d do differently" [level=2] [ref=f2e207]
          - paragraph [ref=f2e208]: The generator arrived after the first specs were hand-written, which meant a migration and a period where both were half-true. Generated artefacts should be generated from the first commit — the discipline is cheap at the start and expensive to retrofit.
          - paragraph [ref=f2e209]: I would also treat the fingerprint attribution as a measured component rather than an assumed-correct one. It works, but I know that by inspection. It deserves a labelled set and a reported accuracy figure, because every monitoring number downstream inherits its error.
