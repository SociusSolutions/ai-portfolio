          - heading "Lead Flow Atlas" [level=1] [ref=f2e19]
          - paragraph [ref=f2e20]: The CRM's API refuses to describe its own automations. So the automations became specifications, and the specifications became testable.
        - region "Project summary" [ref=f2e21]:
          - generic [ref=f2e22]:
