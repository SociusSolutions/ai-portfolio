<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != "/" %}{{ page.title }} &middot; {{ site.title }}{% else %}{{ site.title }} &middot; {{ site.tagline }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_newlines | truncate: 200 }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
  <meta property="og:description" content="{{ page.description | default: site.description | strip_newlines | truncate: 200 }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <script>
    (function(){
      try{
        var t = localStorage.getItem('rb-theme');
        if(t){ document.documentElement.setAttribute('data-theme', t); }
      }catch(e){}
    })();
  </script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  {% include masthead.html %}
  <main id="main">
    {{ content }}
  </main>
  {% include footer.html %}
  {% if page.mermaid %}{% include mermaid.html %}{% endif %}
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
