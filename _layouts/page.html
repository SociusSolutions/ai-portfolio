---
layout: default
---
<article class="doc">
  <div class="wrap">
    <header class="doc__head rise">
      <div class="doc__eyebrow">
        <span class="label">{{ page.eyebrow | default: "Overview" }}</span>
      </div>
      <h1>{{ page.title }}</h1>
      {% if page.subtitle %}<p class="doc__sub">{{ page.subtitle }}</p>{% endif %}
    </header>
    <div class="prose">
      {{ content }}
    </div>
  </div>
</article>
